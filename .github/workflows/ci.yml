name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up stable Rust
        uses: actions-rust-lang/setup-rust-toolchain@4f937ac0ba337db0b2c2394bdb358f5865caa038 # v1.16.1 action code
        with:
          toolchain: stable
          components: clippy,rustfmt
          cache: false

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test

      - name: Run Clippy
        run: cargo clippy -- -D warnings

      - name: Build
        run: cargo build
